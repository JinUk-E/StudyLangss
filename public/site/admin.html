<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>공방 관리 · 별빛공방</title><link rel="stylesheet" href="/site/styles.css"><script type="module" src="/site/admin.js"></script></head>
<body class="admin-body"><header class="site-header wrap"><a class="brand" href="/"><span class="brand-star">✦</span>별빛공방</a><nav><a href="/" target="_blank" rel="noopener">메인 보기 ↗</a><a href="/chat/">AI 대화 ↗</a></nav></header>
<main class="wrap admin-main"><div class="section-head"><div><p class="eyebrow">WORKSHOP DESK</p><h1>공방 관리</h1></div><p>나의 소개와 작업을<br>직접 채워가는 곳.</p></div><div id="status" class="admin-status" role="status" aria-live="polite"></div>
<section class="admin-panel"><div class="panel-head"><div><h2>나의 소개</h2><p>나중에 작성한 소개 문구를 이곳에 붙여넣으세요. 저장하면 메인에 바로 반영됩니다.</p></div></div><form id="profile-form"><fieldset><div class="form-grid"><label>표시 이름<input name="name" maxlength="60" required></label><label>분야 · 직함<input name="role" maxlength="120" placeholder="예: Game Developer / Creative Technologist"></label><label class="wide">메인 소개 문구<textarea name="tagline" maxlength="200" rows="2" placeholder="별빛공방을 소개하는 짧은 문장"></textarea></label><label class="wide">자기소개<textarea name="bio" maxlength="3000" rows="4" placeholder="관심 분야, 작업 방식, 소개하고 싶은 이야기를 작성하세요."></textarea></label><label>공개 이메일<input name="email" type="email" maxlength="254" placeholder="공개하고 싶을 때만 입력"></label><label>GitHub 주소<input name="githubUrl" type="url" placeholder="https://github.com/..."></label><label class="wide">추가 연락처 · 소개 링크<input name="contactUrl" type="url" placeholder="https://..."></label></div><div class="form-actions"><button class="button dark" type="submit">소개 저장</button></div></fieldset></form></section>
<section class="admin-panel"><div class="panel-head"><div><h2>나의 프로젝트</h2><p>초안으로 준비하고, 공개를 켜면 포트폴리오에 나타납니다.</p></div><button id="new-project" class="button dark">＋ 프로젝트 추가</button></div><div id="project-list" class="admin-project-list"></div></section>
<section id="editor" class="admin-panel" hidden><div class="panel-head"><div><p class="eyebrow">PROJECT EDITOR</p><h2 id="editor-title">새 프로젝트</h2></div><button id="cancel-edit" type="button" class="button light">닫기</button></div><form id="project-form"><fieldset><div class="form-grid"><label class="wide">프로젝트 이름<input name="title" maxlength="100" required></label><label>분류<input name="category" maxlength="40" placeholder="예: 게임 / 웹 / 도구"></label><label>작업 기간<input name="year" maxlength="30" placeholder="예: 2026 · 개인 프로젝트"></label><label class="wide">짧은 소개<textarea name="summary" maxlength="300" rows="2"></textarea></label><label class="wide">상세 설명<textarea name="description" maxlength="12000" rows="8" placeholder="어떤 문제를 풀었나요? 무엇을 만들고, 무엇을 배웠나요?"></textarea></label><label>담당 역할<input name="role" maxlength="160" placeholder="예: 기획 · 개발 · 디자인"></label><label>기술 · 키워드<input name="tags" maxlength="320" placeholder="쉼표로 구분 · 최대 8개"></label><label>프로젝트 링크<input name="link" type="url" placeholder="https://..."></label><label>소스 코드 링크<input name="repository" type="url" placeholder="https://github.com/..."></label><label class="wide">대표 이미지<input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp"><small>PNG · JPEG · WebP, 파일당 최대 8MB. 공개한 프로젝트의 이미지만 방문자에게 표시됩니다.</small></label><div id="cover-preview" class="wide upload-preview"></div><label class="wide">추가 이미지<input id="gallery-files" type="file" accept="image/png,image/jpeg,image/webp" multiple><small>최대 6개. 입력한 설명 아래에 순서대로 표시됩니다.</small></label><div id="gallery-preview" class="wide upload-preview"></div><label>정렬 순서<input name="order" type="number" min="0" max="9999" value="0"><small>작은 숫자부터 표시됩니다.</small></label><div class="publication"><label class="check"><input name="featured" type="checkbox">대표작으로 먼저 표시</label><label class="check"><input name="published" type="checkbox">포트폴리오에 공개</label></div></div><div class="form-actions"><button class="button dark" type="submit">프로젝트 저장</button><button id="preview-project" type="button" class="button light">미리보기</button><span class="form-note">공개를 끄고 저장하면 초안으로 보관됩니다.</span></div></fieldset></form></section>
</main><footer class="site-footer wrap"><span>STARLIGHT FORGE · WORKSHOP DESK</span><a href="/">메인으로 ↗</a></footer><dialog id="preview-dialog"><div class="detail-top"><span class="eyebrow">DRAFT PREVIEW</span><button id="close-preview" class="icon-button" aria-label="미리보기 닫기">✕</button></div><div id="preview-body"></div></dialog></body></html>
